<!DOCTYPE html>
<html lang="id" class="js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="[title] — Detail proyek Anton, Software Engineer & AI Architect.">
    <title>[title] — Anton Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/style.css">
</head>

<body>

    <canvas id="bio-canvas" aria-hidden="true"></canvas>
    <div id="cursor-dot" aria-hidden="true"></div>
    <div id="cursor-ring" aria-hidden="true"></div>

    <nav id="main-nav" role="navigation" aria-label="Navigasi utama">
        <a href="/" class="nav-logo" id="nav-logo">
            <span class="logo-zero">zero</span><span class="logo-man">man</span><span class="logo-cursor" aria-hidden="true"></span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link active" id="nav-home">Home</a>
            <a href="/about" class="nav-link" id="nav-about">About</a>
            <a href="/contact" class="nav-cta" id="nav-contact">Hire Me →</a>
        </div>
    </nav>

    <div class="page-wrapper">
        <section class="section" style="padding-top: 80px;">
            <div class="container">

                <!-- Project Detail Content — used by modal & standalone page -->
                <div class="project-detail">
                    <!-- Back link -->
                    <a href="/" id="back-link" style="
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        font-family: var(--font-mono);
                        font-size: 0.72rem;
                        font-weight: 700;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        color: var(--fg-muted);
                        text-decoration: none;
                        margin-bottom: 40px;
                        transition: color 0.25s;
                    ">← Kembali</a>

                    <!-- Header -->
                    <div class="project-detail-header fade-up">
                        <div class="section-eyebrow" style="margin-bottom: 16px;">// detail proyek</div>
                        <h1 class="section-title" style="font-size: clamp(1.8rem, 3vw, 2.6rem); margin-bottom: 16px;">[title]</h1>
                        <p style="font-size: 1.05rem; color: var(--fg-dim); line-height: 1.75; max-width: 680px; font-weight: 300;">[description]</p>

                        <!-- Meta row -->
                        <div style="display: flex; align-items: center; gap: 16px; margin-top: 24px; flex-wrap: wrap;">
                            <div class="project-tags">
                                [tags]
                            </div>
                            <span class="project-status [status]" style="display:inline-block;">
                                [status]
                            </span>
                            <span style="font-family:var(--font-mono); font-size:0.68rem; color:var(--fg-muted); letter-spacing:0.08em;">[year]</span>
                        </div>
                    </div>

                    <!-- Detail Content -->
                    <div class="project-content fade-up delay-1">
                        <p>[details]</p>
                    </div>

                    <!-- Footer CTA -->
                    <div class="fade-up delay-2" style="
                        margin-top: 48px;
                        padding: 40px;
                        background: var(--glass);
                        border: 1px solid var(--border-mid);
                        border-radius: var(--radius-lg);
                        backdrop-filter: blur(16px);
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        flex-wrap: wrap;
                        gap: 20px;
                    ">
                        <div>
                            <div style="font-size: 1.1rem; font-weight: 700; color: var(--fg); margin-bottom: 6px;">Tertarik dengan proyek seperti ini?</div>
                            <div style="font-size: 0.88rem; color: var(--fg-dim); font-weight: 300;">Mari diskusikan project Anda.</div>
                        </div>
                        <a href="/contact" class="btn-primary" id="project-cta">Hubungi Saya →</a>
                    </div>
                </div>

            </div>
        </section>

        <footer>
            <div class="container">
                <div class="footer-inner">
                    <a href="/" class="footer-logo" id="footer-logo">
                        <span class="logo-zero">zero</span><span class="logo-man">man</span>
                    </a>
                    <p class="footer-copy">© 2026 — Dibangun dengan tangan, bukan template.</p>
                    <div class="footer-social">
                        <a href="#" class="social-link" title="GitHub" id="footer-github">GH</a>
                        <a href="#" class="social-link" title="LinkedIn" id="footer-linkedin">LI</a>
                        <a href="/contact" class="social-link" title="Email" id="footer-email">✉</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="/public/js/main.js"></script>
</body>

</html>
